<!-- Simplified stand-in for Workday's "My Experience" step. Built by hand from the visible
     labels and controls; NOT a copy of Workday's real markup. Used to test page-object logic. -->
<html><body>
<section aria-label="Work Experience"><div id="work"></div>
  <button onclick="addWork()">Add Another</button></section>
<section aria-label="Education"><div id="edu"></div>
  <button id="eduBtn" onclick="addEdu()">Add</button></section>
<section aria-label="Languages"><button>Add</button></section>
<input type="file" multiple id="files">
<button>Save and Continue</button>
<script>
let w=0,e=0;
function date(name){const g=document.createElement('div');g.setAttribute('role','group');g.setAttribute('aria-label',name);
 g.innerHTML='<input role="spinbutton" aria-label="'+name+' value" data-v="">';
 g.querySelector('input').addEventListener('keydown',ev=>{ev.target.dataset.v+=ev.key;ev.preventDefault();});return g;}
function lab(t,id,tag){return '<label for="'+id+'">'+t+'</label><'+tag+' id="'+id+'"></'+tag+'>';}
function addWork(){w++;const d=document.createElement('div');
 d.innerHTML=lab('Job Title*','jt'+w,'input')+lab('Company*','co'+w,'input')+lab('Location','lo'+w,'input')+
  '<label for="cw'+w+'">I currently work here</label><input type="checkbox" id="cw'+w+'">';
 d.append(date('From'),date('To'));
 d.insertAdjacentHTML('beforeend',lab('Role Description*','rd'+w,'textarea'));
 document.getElementById('work').append(d);}
function addEdu(){e++;const d=document.createElement('div');
 d.innerHTML=lab('School or University*','sc'+e,'input')+
  '<button id="dg'+e+'" aria-label="Degree*" onclick="openList(this)">Select One</button>'+
  lab('Field of Study','fs'+e,'input');
 d.append(date('From'),date('To (Actual or Expected)'));
 document.getElementById('edu').append(d);document.getElementById('eduBtn').textContent='Add Another';}
function openList(btn){document.querySelectorAll('[role=listbox]').forEach(x=>x.remove());
 const l=document.createElement('div');l.setAttribute('role','listbox');
 ['High School Diploma','Bachelor','Master'].forEach(t=>{const o=document.createElement('div');o.setAttribute('role','option');o.textContent=t;
  o.onclick=()=>{btn.textContent=t;l.remove();};l.append(o);});document.body.append(l);}
addWork();
</script></body></html>
